name: Update Kobo volunteer list

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: kobo-volunteer-sync
  cancel-in-progress: false
  
jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: python -m pip install requests

      - name: Fetch volunteers from Kobo
        env:
          KOBO_API_KEY: ${{ secrets.KOBO_API_KEY }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
          KOBO_SERVER: https://kf.kobotoolbox.org
        run: python update_volunteers.py

      - name: Commit changed volunteer list
        run: |
          git config user.name "Kobo Volunteer Sync"
          git config user.email "actions@users.noreply.github.com"
          git add volunteers.csv
          if git diff --cached --quiet; then
            echo "No volunteer-list changes."
           else
            git commit -m "Update volunteer list from Kobo"
            git pull --rebase origin main
            git push origin main
          fi
